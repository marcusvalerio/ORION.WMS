<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORION Brand Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: folhas de livro de marca empilhadas, folhas brancas de conteúdo intercaladas com folhas de abertura em cor sólida. Visual único (papel), sem tema escuro. */
:root{
  color-scheme: light;
  --mesa:#DCE8F3;      /* gelo-200, a mesa onde as folhas repousam */
  --papel:#FFFFFF;
  --noite:#060B2A;     /* noite-900 */
  --noite-7:#172354;
  --ceu:#2D77CC;       /* céu-600 */
  --ceu-4:#7DB7F0;
  --gelo:#F7F9FC;
  --gelo-3:#C7D3E2;
  --gelo-6:#5E6A82;
  --creme:#DDB54C;
  --creme-2:#FDEFCB;
  --linha:#DCE3EC;
  --display:"Gabarito", "Inter", ui-sans-serif, system-ui, sans-serif;
  --texto:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
body{background:var(--mesa);color:var(--noite);font-family:var(--texto);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}
.livro{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.folha{background:var(--papel);aspect-ratio:16/9;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:22px 28px;container-type:inline-size;position:relative;overflow:hidden}
.folha.cor{color:var(--noite)}
.cab,.rod{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:16px;font-size:10px;letter-spacing:.02em;color:inherit;opacity:.85}
.cab span:last-child,.rod span:last-child{text-align:right;font-family:var(--mono)}
.corpo{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:minmax(0,1fr);gap:4cqw;padding-block:4cqw 2cqw;min-height:0}
.lado h2{font-family:var(--display);font-weight:600;font-size:clamp(16px,1.9cqw,22px);margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
.lado h3{font-family:var(--display);font-weight:600;font-size:13px;margin:18px 0 6px}
.lado p,.lado li{font-size:clamp(10px,1cqw,12px);color:var(--gelo-6);margin:0 0 8px;max-width:46ch}
.lado ul{padding-left:14px;margin:0 0 8px}
.lado strong{color:var(--noite);font-weight:600}
.rot{font-size:10px;color:var(--gelo-6);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.mono{font-family:var(--mono)}
/* abertura */
.abre{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.abre h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,8.4cqw,104px);letter-spacing:-.035em;line-height:.92;margin:0}
.abre svg{width:clamp(48px,7cqw,88px);height:auto;flex:none}
/* capa */
.capa{background:var(--noite);color:#EAF1FB}
.capa .abre h1{font-size:clamp(48px,12cqw,150px)}
.capa .sub{font-family:var(--texto);font-size:clamp(12px,1.4cqw,16px);color:var(--ceu-4);max-width:40ch;margin-top:14px}
.arco{position:absolute;right:-12cqw;top:-18cqw;width:62cqw;height:62cqw;border-radius:50%;border:1px solid rgba(125,183,240,.35)}
.arco::after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(125,183,240,.22)}
.cinto{position:absolute;right:16cqw;top:13cqw;display:flex;gap:4cqw;transform:rotate(-18deg)}
.cinto i{width:.9cqw;height:.9cqw;border-radius:50%;background:#EAF1FB;box-shadow:0 0 0 .5cqw rgba(125,183,240,.12)}
/* tipos */
.alfabeto{font-size:clamp(16px,2.4cqw,30px);line-height:1.22;letter-spacing:-.005em;word-break:break-all}
.grande{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.6cqw,58px);letter-spacing:-.025em;line-height:1;margin:0 0 3cqw}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.4cqw}
.specs h4{font-family:var(--display);font-weight:600;font-size:13px;margin:0 0 6px}
.specs p,.specs li{font-size:clamp(10px,.95cqw,12px);color:var(--gelo-6);margin:0 0 6px}
.specs ul{padding-left:14px;margin:0}
.escala{display:flex;flex-direction:column;gap:1.2cqw}
.escala div{display:grid;grid-template-columns:9ch 1fr;align-items:baseline;gap:16px;border-bottom:1px solid var(--linha);padding-bottom:1cqw;min-width:0}
.escala .mono{font-size:10px;color:var(--gelo-6)}
.escala b{font-weight:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* cores */
.paleta{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-content:start}
.cartao{border-radius:6px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;min-height:7.6cqw;font-size:clamp(8px,.78cqw,10px)}
.cartao .t{font-size:9px;opacity:.75}
.cartao b{font-family:var(--display);font-weight:600;font-size:clamp(11px,1.15cqw,14px);display:block;margin-top:auto}
.cartao .mono{opacity:.85}
.larga{grid-column:span 3;min-height:9cqw}
.combos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4cqw;align-content:start}
.combos div{aspect-ratio:1.25;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px}
.combos b{font-family:var(--display);font-weight:500;font-size:clamp(22px,3.2cqw,40px);line-height:1}
.combos span{font-size:clamp(9px,.9cqw,11px)}
.combos em{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.7}
/* marca */
.palco{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6cqw}
.quadro{border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:2cqw;position:relative;min-height:0}
.quadro small{position:absolute;left:10px;top:8px;font-size:9px;color:var(--gelo-6);letter-spacing:.04em;text-transform:uppercase}
.quadro.escuro{background:var(--noite);border-color:var(--noite)}
.quadro.escuro small{color:var(--ceu-4)}
.logo{display:flex;align-items:center;gap:.4em;font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:clamp(18px,2.4cqw,30px)}
.logo svg{width:1.47em;height:1.47em}
.nao svg.x{position:absolute;right:10px;top:8px;width:14px;height:14px}
/* gráficos */
.pilulas{display:flex;flex-wrap:wrap;gap:6px;align-content:center}
.pil{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:clamp(10px,1cqw,12px);font-weight:500;border:1px solid}
.pil i{width:6px;height:6px;border-radius:50%}
.ok{background:#E8F7F1;color:#0B6B4F;border-color:#B4E5D2}.ok i{background:#12A27A}
.warn{background:#FFF6DB;color:#7A5300;border-color:#F5D98A}.warn i{background:#E0A100}
.crit{background:#FDECEC;color:#A3202A;border-color:#F5BDC0}.crit i{background:#E03A45}
.info{background:#F1F7FE;color:#1E4C82;border-color:#BCD9F8}.info i{background:#4E97E3}
.neu{background:#F7F9FC;color:#46516A;border-color:#DCE3EC}.neu i{background:#A6B3C6}
.barras{display:flex;align-items:flex-end;gap:6px;height:100%;padding-top:20px;width:100%}
.barras span{flex:1;background:var(--noite);border-radius:3px 3px 0 0}
.barras span:nth-child(3n){background:var(--ceu)}
.barras span:nth-child(4n){background:var(--ceu-4)}
.cartaz{background:var(--noite);color:#EAF1FB;width:58%;aspect-ratio:3/4;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border-radius:2px}
.cartaz b{font-family:var(--display);font-weight:600;font-size:clamp(14px,1.8cqw,22px);line-height:1.05}
.cartaz span{font-size:9px;color:var(--ceu-4);display:flex;gap:6px;align-items:center}
.ui{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.btn{border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;border:1px solid transparent;font-family:var(--texto)}
.raios{display:flex;gap:14px;align-items:flex-end}
.raios div{width:5cqw;height:5cqw;border:1.5px solid var(--noite);background:var(--gelo)}
.raios p{font-size:10px;color:var(--gelo-6);margin:4px 0 0;font-family:var(--mono)}
.voz{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;align-content:start}
.voz div{border:1px solid var(--linha);padding:1.4cqw;font-size:clamp(10px,1cqw,12px)}
.voz .sim{border-color:#B4E5D2;background:#F4FBF8}
.voz .nao2{border-color:#F5BDC0;background:#FEF7F7}
.voz b{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.eco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6cqw}
.eco div{border:1px solid var(--linha);padding:1.6cqw;display:flex;flex-direction:column;gap:6px}
.eco h4{font-family:var(--display);font-weight:600;font-size:clamp(16px,2cqw,24px);letter-spacing:.12em;margin:0}
.eco p{font-size:clamp(10px,.95cqw,12px);color:var(--gelo-6);margin:0}
.sumario{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 4cqw;align-content:start}
.sumario a{display:grid;grid-template-columns:4ch 1fr auto;gap:12px;align-items:baseline;border-bottom:1px solid var(--linha);padding:1.1cqw 0;color:inherit;text-decoration:none;font-family:var(--display);font-weight:500;font-size:clamp(14px,1.8cqw,22px)}
.sumario a:hover{color:var(--ceu)}
.sumario a:focus-visible{outline:2px solid var(--ceu);outline-offset:2px}
.sumario .mono{font-size:11px;color:var(--gelo-6)}
@media (max-width:760px){
  .folha{aspect-ratio:auto;padding:18px}
  .cab,.rod{grid-template-columns:1fr auto}.cab span:nth-child(2),.cab span:nth-child(3),.rod span:nth-child(2),.rod span:nth-child(3){display:none}
  .corpo{grid-template-columns:1fr;gap:24px;padding-block:24px 16px}
  .abre{min-height:56vw}
  .paleta{grid-template-columns:repeat(3,minmax(0,1fr))}.cartao{min-height:72px}
  .combos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .specs,.eco,.sumario{grid-template-columns:1fr}
  .palco{grid-template-columns:1fr}.quadro{min-height:150px}
  .raios div{width:44px;height:44px}
}
@media (prefers-reduced-motion:no-preference){.capa .arco{animation:gira 90s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}}

/* aplicações */
.mesa{display:grid;gap:1.6cqw;flex:1;min-height:0}.mesa>div{min-height:0}
.mk{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:1.6cqw;border-radius:4px}
.mk .tag{align-self:flex-start;border-radius:999px;padding:2px 9px;font-size:clamp(8px,.8cqw,10px);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mk h5{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.02em;line-height:1}
.mk .sig{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:clamp(8px,.85cqw,11px)}
.mk .sig svg{width:1.3em;height:1.3em}
.leg{font-size:10px;color:var(--gelo-6);margin-top:6px;letter-spacing:.02em}
.ico{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.2cqw}
.ico div{border:1px solid var(--linha);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:9px;color:var(--gelo-6)}
.ico svg{width:38%;height:auto;stroke:var(--noite);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.foto{border-radius:4px;position:relative;min-height:0;display:flex;align-items:flex-end;padding:10px;font-size:10px}
.foto b{position:absolute;top:8px;left:10px;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:1cqw;flex:1}
.grid12 span{background:rgba(45,119,204,.10);border-left:1px solid rgba(45,119,204,.4);border-right:1px solid rgba(45,119,204,.4)}
.cod{display:flex;gap:1px;height:100%;align-items:stretch}
.cod i{background:#060B2A}
.val{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4cqw;align-content:start}
.val div{border-top:2px solid var(--noite);padding-top:1cqw}
.val h4{font-family:var(--display);font-weight:600;font-size:clamp(14px,1.6cqw,20px);margin:0 0 4px}
.val p{font-size:clamp(10px,.95cqw,12px);color:var(--gelo-6);margin:0}
@media (max-width:760px){.mesa{grid-template-columns:1fr!important}.mk{min-height:200px}.ico{grid-template-columns:repeat(3,minmax(0,1fr))}.val{grid-template-columns:1fr}}
</style>
</head>
<body>

<main class="livro" id="livro"></main>

const COL=[[-0.7,.15,[[-.3,-.06],[.04,.34]]],[-.44,.19,[[-.58,-.14],[-.04,.58]]],[-.17,.13,[[-.8,-.4],[-.3,.22],[.32,.8]]],[.08,.17,[[-.86,.08],[.18,.86]]],[.32,.1,[[-.78,-.16],[-.06,.78]]],[.52,.07,[[-.62,.14],[.24,.62]]],[.7,.045,[[-.44,.44]]]];
const RW=[0.15,0.19,0.13,0.17,0.1,0.07,0.045],RH=[0.64,1.16,1.6,1.72,1.56,1.24,0.88],RC=[[0.45,0.55],[0.38,0.47],[0.25,0.31,0.63,0.69],[0.55,0.61],[0.4,0.46],[0.62,0.7],[]];
const RPAL={externo:["#2D77CC","#7DB7F0","#22306F","#7DB7F0","#2D77CC","#FFF8E7","#22306F"],interno:["#22306F","#172354","#2D77CC","#22306F"],tinta:["#060B2A"],ceu:["#7DB7F0","#2D77CC","#9DC7F4"]};
const cinturao=(pal="externo",n=84,gira=0,st="")=>{const cs=RPAL[pal]||pal;let g="";for(let i=0;i<n;i++){const j=(i*3+Math.floor(i/7))%7,w=RW[j]*190,L=RH[j]*340,top=-(1000+L/2),pts=[0,...RC[j],1];let r="";for(let p=0;p<pts.length;p+=2)r+=`<rect x="${(-w/2).toFixed(1)}" y="${(top+pts[p]*L).toFixed(1)}" width="${w.toFixed(1)}" height="${((pts[p+1]-pts[p])*L).toFixed(1)}"/>`;g+=`<g transform="rotate(${(i*360/n).toFixed(2)})" fill="${cs[(i*5)%cs.length]}">${r}</g>`}return `<svg viewBox="-1400 -1400 2800 2800" style="display:block;${st}" aria-hidden="true"><g class="${gira?"gira":""}" style="transform-origin:0 0;${gira?`animation:gira ${gira}s linear infinite`:""}">${g}</g></svg>`};
const shot=(k,st="")=>`<img src="${IMG[k]}" alt="" style="display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid #DCE3EC;box-shadow:0 18px 40px rgba(6,11,42,.12);${st}">`;
const nota=(n,t)=>`<div style="display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:clamp(10px,.95cqw,12px);color:#46516A"><b class="mono" style="color:#2D77CC">${n}</b><span>${t}</span></div>`;
const SEGS=COL.flatMap(([x,w,s])=>s.slice().reverse().map(([a,b])=>[x,w,a,b]));
const glyph=(lit,on="#7DB7F0",off="#DCE8F3")=>`<svg viewBox="-1 -1 2 2" style="width:100%;height:auto;display:block">${SEGS.map(([x,w,a,b],i)=>`<rect x="${(x-w/2).toFixed(3)}" y="${a}" width="${w}" height="${(b-a).toFixed(3)}" fill="${i<lit?on:off}"/>`).join("")}</svg>`;
const marca=(c="currentColor",extra="")=>`<svg viewBox="-1 -1 2 2" fill="${c}" aria-hidden="true" ${extra}>`+COL.flatMap(([x,w,s])=>s.map(([a,b])=>`<rect x="${(x-w/2).toFixed(3)}" y="${a}" width="${w}" height="${(b-a).toFixed(3)}"/>`)).join("")+`</svg>`;
const construcao=()=>`<svg viewBox="-1.15 -1.15 2.3 2.3" style="width:62%;height:auto" aria-label="Construção do símbolo"><circle r="1" fill="none" stroke="#7DB7F0" stroke-width=".008" stroke-dasharray=".03 .02"/><circle r=".86" fill="none" stroke="#C7D3E2" stroke-width=".006"/>${COL.map(([x])=>`<line x1="${x}" x2="${x}" y1="-1.1" y2="1.1" stroke="#C7D3E2" stroke-width=".005"/>`).join("")}<line x1="-1.1" x2="1.1" y1="0" y2="0" stroke="#C7D3E2" stroke-width=".005"/>${COL.flatMap(([x,w,s])=>s.map(([a,b])=>`<rect x="${x-w/2}" y="${a}" width="${w}" height="${b-a}" fill="#060B2A" fill-opacity=".9"/>`)).join("")}</svg>`;

const X=`<svg class="x" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="#E03A45" stroke-width="1.8" fill="none"/></svg>`;
let n=0;
const cab=(sec)=>{n++;return `<header class="cab"><span>${sec}</span><span>Livro de marca</span><span>Edição 2026</span><span>${String(n).padStart(2,"0")}</span></header>`};
const rod=(sec)=>`<footer class="rod"><span>${sec}</span><span>ORION · universo ASTRAEUS</span><span>orionwms.vercel.app</span><span></span></footer>`;
const folha=(sec,html,cls="",style="")=>`<section class="folha ${cls}" style="${style}">${cab(sec)}${html}${rod(sec.split(" • ")[0])}</section>`;
const PG=[];const abertura=(num,nome,bg,fg="#060B2A",id="")=>{PG.push([num,nome,n+1]);return `<section class="folha cor" id="${id}" style="background:${bg};color:${fg}">${cab(nome)}<div class="abre"><h1>${num} ${nome}</h1>${marca(fg)}</div>${rod(nome)}</section>`};
const lado=(t,html)=>`<div class="lado"><h2>${t}</h2>${html}</div>`;
const corpo=(a,b)=>`<div class="corpo">${a}<div style="min-width:0;display:flex;flex-direction:column">${b}</div></div>`;
const cart=(t,nome,hex,extra,bg,fg,cls="")=>`<div class="cartao ${cls}" style="background:${bg||hex};color:${fg}"><span class="t">${t}</span><span><b>${nome}</b><span class="mono">${hex}</span><br><span class="mono">${extra}</span></span></div>`;

const P=[];
P.push(`<section class="folha capa">${cab("Capa")}<div style="position:absolute;right:-22cqw;top:-30cqw;width:90cqw;opacity:.95">${cinturao("externo",96,240)}</div><div style="position:absolute;right:13.5cqw;top:5cqw;width:19cqw;opacity:.9">${marca("#EAF1FB")}</div><div class="abre" style="position:relative"><div><h1>orion</h1><p class="sub">Livro de marca do sistema de gestão de armazém. Céu de inverno: noite profunda, gelo e um único azul que guia.</p></div>${marca("#EAF1FB")}</div>${rod("Capa")}</section>`);
P.push(folha("Sumário",corpo(lado("Sumário",`<p>Este livro reúne as decisões que fazem o ORION ser reconhecido em qualquer tela, papel ou etiqueta de doca.</p><p>Vale para produto, site, e-mails, documentos e materiais de venda. Quando houver dúvida, prefira o mais simples.</p>`),`<nav class="sumario">%%SUM%%</nav>`)));
P.push(folha("Manifesto",corpo(lado("Por que ORION",`<p>Órion é a constelação que se acha sem esforço no céu de inverno: três estrelas em linha, o cinturão. No ORION, o cinturão é o próprio O. Marinheiros e pastores se guiavam por ela.</p><p>Um armazém pede o mesmo. Cada caixa tem um lugar, cada pedido um caminho, e quem opera precisa achar tudo de primeira.</p>`),`<p class="grande" style="max-width:18ch">Cada caixa no lugar certo, e você sabe onde.</p><div class="specs"><div><h4>Preciso</h4><p>Números conferidos, endereços exatos, nada aproximado.</p></div><div><h4>Calmo</h4><p>A tela não grita. A cor aparece quando algo pede atenção.</p></div><div><h4>Guia</h4><p>O sistema mostra o próximo passo em vez de esperar que alguém procure.</p></div></div>`)));

const SG=(fill,ex="")=>COL.flatMap(([x,w,s])=>s.map(([a,b])=>`<rect x="${(x-w/2).toFixed(3)}" y="${a}" width="${w}" height="${(b-a).toFixed(3)}" fill="${fill}" ${ex}/>`)).join("");

const estudio=(h,bg="radial-gradient(120% 90% at 30% 10%,#22306F 0%,#0D163B 45%,#060B2A 100%)")=>`<div style="position:relative;flex:1;min-height:0;overflow:hidden;border-radius:4px;background:${bg};perspective:1400px">${h}</div>`;

P.push(abertura("01","Estratégia","#EDF2F8","#060B2A","s01"));
P.push(folha("Estratégia • Plataforma",corpo(lado("Plataforma de marca",`<p>Antes da forma, o porquê. Tudo neste livro decorre destas quatro frases.</p><p>Elas orientam produto, site, vendas e atendimento. Quando uma decisão de design não se apoia em nenhuma delas, provavelmente está errada.</p>`),`<div class="val"><div><p class="rot">Propósito</p><h4>Dar ordem ao que se move.</h4><p>Armazéns são lugares de fluxo. Existimos para que esse fluxo seja previsível.</p></div><div><p class="rot">Missão</p><h4>Que cada operação saiba onde está cada item, agora.</h4><p>Do recebimento à expedição, sem planilha paralela.</p></div><div><p class="rot">Visão</p><h4>Ser o céu pelo qual a logística brasileira se orienta.</h4><p>A referência de WMS simples para empresas de médio porte.</p></div><div><p class="rot">Promessa</p><h4>Cada caixa no lugar certo, e você sabe onde.</h4><p>A frase que resume a marca para quem não leu nada além dela.</p></div></div>`)));
P.push(folha("Estratégia • Valores",corpo(lado("Valores",`<p>Valores são escolhas. Cada um aqui exclui algo que outras marcas aceitam.</p>`),`<div class="val">${[["Exatidão antes de velocidade","Um pedido certo vale mais que dois rápidos. Nada sai sem conferência."],["Clareza no chão","Se o operador precisa de treinamento para entender uma tela, a tela está errada."],["Calma sob pressão","Picos de fim de mês são normais. O sistema não entra em pânico, e quem usa também não."],["Integração sem atrito","ORION conversa com ATLAS, com a SEFAZ e com quem mais precisar, sem retrabalho manual."]].map(([a,b])=>`<div><h4>${a}</h4><p>${b}</p></div>`).join("")}</div>`)));
P.push(folha("Estratégia • Público",corpo(lado("Para quem falamos",`<p>Três pessoas usam o ORION todos os dias. A marca precisa funcionar para as três ao mesmo tempo.</p><h3>Posicionamento</h3><p>Para operações de armazém que cresceram além da planilha, <strong>ORION é o WMS</strong> que organiza estoque e expedição <strong>sem projeto de implantação de seis meses</strong>, porque já nasce ligado ao ERP.</p>`),`<div class="eco" style="align-content:start">${[["Gestor","Decide a compra. Quer ver acuracidade, custo e prazo num painel. Lê no computador."],["Líder de turno","Distribui ondas e resolve divergência. Precisa de status claro e alerta cedo."],["Operador","Bipa, separa e confere no coletor. Precisa de texto grande, código claro e zero ambiguidade."]].map(([a,b])=>`<div><h4 style="letter-spacing:0">${a}</h4><p>${b}</p></div>`).join("")}</div>`)));
P.push(folha("Estratégia • Personalidade",corpo(lado("Personalidade",`<p>Se o ORION fosse uma pessoa, seria a líder de turno que todo mundo procura quando algo dá errado: segura, direta, sem drama.</p><p>A régua ao lado ajuda a calibrar tom, imagem e movimento.</p>`),`<div class="voz">${[["Seguro","Arrogante"],["Direto","Seco"],["Técnico","Hermético"],["Calmo","Apagado"],["Moderno","Modinha"],["Próximo","Íntimo"]].map(([a,b])=>`<div class="sim"><b style="color:#0B6B4F">Somos</b>${a}</div><div class="nao2"><b style="color:#A3202A">Não somos</b>${b}</div>`).join("")}</div>`)));

P.push(abertura("02","Marca","#7DB7F0","#060B2A","s02"));
P.push(folha("Marca • Símbolo",corpo(lado("O símbolo",`<p>Sete colunas de barras recortadas formam um <strong>O</strong>. Abertas em círculo, elas viram o cinturão (próxima folha). Lidas de outra forma, são prateleiras vistas de cima, com vãos de corredor.</p><p>As colunas afinam para a direita, como um objeto em rotação.</p><h3>Construção</h3><ul><li>Círculo de raio R, colunas fixas em −0,70R a +0,70R</li><li>Larguras de 0,045R a 0,19R</li><li>Vãos horizontais de no mínimo 0,06R</li></ul><p>A geometria vive em <span class="mono">orion-mark.tsx</span>. Nunca redesenhe à mão.</p>`),`<div class="palco" style="flex:1"><div class="quadro"><small>Construção</small>${construcao()}</div><div class="quadro escuro"><small>Símbolo</small><div style="width:48%">${marca("#EAF1FB")}</div></div></div>`)));
P.push(folha("Marca • Cinturão",corpo(lado("O cinturão",`<p>O cinturão é o O do ORION aberto em círculo: as <strong>barras das sete colunas</strong>, com as mesmas larguras, alturas e cortes, repetidas em volta de um anel. É o componente <span class="mono">OrionRing</span>.</p><ul><li><strong>84 a 96 barras</strong>; a sequência das colunas se repete pelo anel</li><li><strong>Gira devagar</strong>: 70 s por volta no topo do site, 240–260 s quando está ao fundo</li><li><strong>Onda</strong>: a cada 4–6 s, uma onda percorre o anel afinando cada barra e devolvendo a espessura</li><li>O centro fica livre para o título, um número ou o símbolo</li><li>Pode sangrar pela borda; não use abaixo de 240 px</li></ul><h3>Paletas</h3><p><strong>Externo</strong> (céu, cobalto, noite e um toque de creme), <strong>interno</strong> (mais escuro), <strong>céu</strong> e <strong>tinta</strong> (uma cor só, como marca d’água no claro).</p>`),`<div style="display:grid;grid-template-columns:1.7fr 1fr;gap:1.6cqw;flex:1;min-height:0"><div class="quadro escuro" style="overflow:hidden"><small>Externo · login e topo do site</small><div style="width:96%;position:relative">${cinturao("externo",96,70)}<div style="position:absolute;left:41%;top:41%;width:18%">${marca("#EAF1FB")}</div></div></div><div style="display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:1.6cqw;min-height:0">${[["interno","#060B2A","Interno"],["ceu","#060B2A","Céu"],["tinta","#FFF8E7","Tinta · marca d’água"]].map(([p,bg,t])=>`<div class="quadro" style="background:${bg};border-color:${bg};overflow:hidden"><small style="color:${bg==="#060B2A"?"#7DB7F0":"#5E6A82"}">${t}</small><div style="height:92%;aspect-ratio:1;${p==="tinta"?"opacity:.16":""}">${cinturao(p,84)}</div></div>`).join("")}</div></div>`)));
P.push(folha("Marca • Assinatura",corpo(lado("Assinatura",`<p>Símbolo à esquerda, nome <strong>orion</strong> em minúsculas, Gabarito Semibold, espaçamento levemente fechado. O corpo do nome é <strong>0,68×</strong> a altura do símbolo, como no componente <span class="mono">OrionLogo</span> do sistema.</p><p>Abaixo do nome pode vir um descritor em Inter 11, cor secundária: “Gestão de armazéns”.</p><h3>Área de proteção</h3><p>Deixe livre, em volta, a largura da letra O.</p><h3>Tamanho mínimo</h3><ul><li>Tela: 16 px de símbolo</li><li>Impresso: 6 mm de símbolo</li><li>Abaixo disso, use só o símbolo</li></ul>`),`<div class="palco" style="flex:1"><div class="quadro"><small>Principal</small>${logo("#060B2A")}</div><div class="quadro escuro"><small>Negativa</small>${logo("#EAF1FB")}</div><div class="quadro" style="background:#F1F7FE"><small>Sobre céu claro</small>${logo("#172354")}</div><div class="quadro" style="background:#2D77CC;border-color:#2D77CC"><small>Sobre céu</small>${logo("#FFFFFF")}</div></div>`)));
P.push(folha("Marca • Usos indevidos",corpo(lado("O que não fazer",`<p>A marca funciona porque é sempre igual. Estas alterações quebram o reconhecimento.</p><ul><li>Não distorcer nem inclinar</li><li>Não aplicar gradiente, sombra ou brilho</li><li>Não trocar a fonte do nome</li><li>Não usar cores fora da paleta</li><li>Não colocar sobre fotos sem contraste</li><li>Não rodear o símbolo de estrelas</li></ul>`),`<div class="palco nao" style="flex:1;grid-template-columns:repeat(3,minmax(0,1fr))"><div class="quadro">${X}<div style="transform:scaleX(1.5)">${logo("#060B2A")}</div></div><div class="quadro">${X}<div class="logo" style="background:linear-gradient(90deg,#7c3aed,#2D77CC);-webkit-background-clip:text;color:transparent">${marca("#7c3aed")}ORION</div></div><div class="quadro">${X}<div class="logo" style="font-family:Georgia,serif;letter-spacing:0;color:#060B2A">${marca("#060B2A")}Orion</div></div><div class="quadro">${X}${logo("#E0A100")}</div><div class="quadro">${X}<div style="transform:rotate(-14deg)">${logo("#060B2A")}</div></div><div class="quadro" style="background:#7DB7F0">${X}${logo("#4E97E3")}</div></div>`)));
const vert=(c)=>`<div class="logo" style="color:${c};flex-direction:column;gap:.35em;font-size:clamp(14px,1.8cqw,22px)">${marca(c,'style="width:2.2em;height:2.2em"')}orion</div>`;
const traco=(c)=>`<svg viewBox="-1 -1 2 2" style="width:1.25em;height:1.25em" fill="none" stroke="${c}" stroke-width=".03">`+COL.flatMap(([x,w,s])=>s.map(([a,b])=>`<rect x="${(x-w/2).toFixed(3)}" y="${a}" width="${w}" height="${(b-a).toFixed(3)}"/>`)).join("")+`</svg>`;
P.push(folha("Marca • Versões",corpo(lado("Versões da assinatura",`<p>A assinatura tem duas composições e um elemento-síntese. Cada uma resolve um formato.</p><ul><li><strong>Horizontal</strong> (preferencial): site, sistema, papelaria</li><li><strong>Vertical</strong>: peças quadradas ou estreitas, brindes, placas</li><li><strong>Elemento-síntese</strong>: só o símbolo, quando a marca já está presente no contexto (ícone do app, perfil, favicon)</li></ul><h3>Versões de cor</h3><ul><li><strong>Positiva</strong>: Noite sobre claro</li><li><strong>Negativa</strong>: Gelo sobre Noite</li><li><strong>Monocromática</strong>: preto 100%, para carimbo, fax e jornal</li><li><strong>Traço</strong>: só contorno, para gravação a laser, bordado e relevo seco</li></ul>`),`<div class="palco" style="flex:1;grid-template-columns:repeat(3,minmax(0,1fr))"><div class="quadro"><small>Horizontal · preferencial</small>${logo("#060B2A")}</div><div class="quadro"><small>Vertical</small>${vert("#060B2A")}</div><div class="quadro"><small>Elemento-síntese</small><div style="width:28%">${marca("#060B2A")}</div></div><div class="quadro escuro"><small>Negativa</small>${logo("#EAF1FB")}</div><div class="quadro"><small>Monocromática</small>${logo("#000000")}</div><div class="quadro"><small>Traço</small><div class="logo" style="color:transparent;-webkit-text-stroke:1px #060B2A;letter-spacing:-.01em">${traco("#060B2A")}orion</div></div></div>`)));
P.push(folha("Marca • Fundos",corpo(lado("Aplicação sobre fundos",`<p>A marca precisa de contraste, não de moldura. Escolha a versão pela cor que predomina atrás dela.</p><ul><li><strong>Fundos claros</strong> (Papel, Gelo, Céu 100): versão positiva</li><li><strong>Fundos escuros</strong> (Noite, Gelo 900, Céu 600): versão negativa</li><li><strong>Tons médios</strong> sem contraste suficiente: use o box, uma placa Noite com a área de proteção como margem</li><li><strong>Fotografias</strong>: aplique na área mais calma da imagem. Se ela for movimentada, use o box</li></ul><p>O box nunca tem cantos arredondados nem sombra.</p>`),`<div class="palco" style="flex:1;grid-template-columns:repeat(3,minmax(0,1fr))"><div class="quadro"><small>Branco</small>${logo("#060B2A")}</div><div class="quadro" style="background:#DCEBFC;border-color:#DCEBFC"><small>Céu 100</small>${logo("#060B2A")}</div><div class="quadro escuro"><small>Noite</small>${logo("#EAF1FB")}</div><div class="quadro" style="background:#7E8BA2;border-color:#7E8BA2"><small style="color:#060B2A">Tom médio · box</small><div style="background:#060B2A;padding:10px 14px">${logo("#EAF1FB")}</div></div><div class="quadro" style="background:linear-gradient(160deg,#33448F,#060B2A 70%)"><small style="color:#9DC7F4">Foto calma</small>${logo("#EAF1FB")}</div><div class="quadro" style="background:repeating-linear-gradient(100deg,#7DB7F0 0 14px,#33448F 14px 26px,#DDB54C 26px 34px)"><small style="color:#060B2A;background:#fff;padding:0 4px">Foto movimentada · box</small><div style="background:#060B2A;padding:10px 14px">${logo("#EAF1FB")}</div></div></div>`)));
P.push(folha("Marca • Proteção e redução",corpo(lado("Área de proteção e redução máxima",`<p>A medida <strong>x</strong> é a largura da letra O da assinatura. Nenhum texto, borda ou imagem entra nessa margem.</p><ul><li>Assinatura horizontal: <strong>x</strong> em volta</li><li>Elemento-síntese: <strong>½ do diâmetro</strong> em volta</li></ul><h3>Redução máxima</h3><table style="font-size:11px;border-collapse:collapse;width:100%"><tr><td></td><td><b>Tela</b></td><td><b>Impresso</b></td></tr><tr><td>Horizontal</td><td class="mono">72 px</td><td class="mono">20 mm</td></tr><tr><td>Vertical</td><td class="mono">40 px</td><td class="mono">12 mm</td></tr><tr><td>Símbolo</td><td class="mono">16 px</td><td class="mono">6 mm</td></tr></table><p style="margin-top:8px">Abaixo disso, a marca não é aplicada.</p>`),`<div class="palco" style="flex:1"><div class="quadro"><small>Horizontal</small><div style="position:relative;padding:clamp(18px,3cqw,40px);outline:1px dashed #7DB7F0;background:repeating-linear-gradient(45deg,#F1F7FE 0 4px,#fff 4px 8px)"><div style="background:#fff">${logo("#060B2A")}</div><span class="mono" style="position:absolute;left:4px;top:2px;font-size:10px;color:#2D77CC">x</span><span class="mono" style="position:absolute;right:4px;bottom:2px;font-size:10px;color:#2D77CC">x</span></div></div><div class="quadro"><small>Elemento-síntese</small><div style="position:relative;padding:clamp(16px,2.6cqw,34px);outline:1px dashed #7DB7F0;background:repeating-linear-gradient(45deg,#F1F7FE 0 4px,#fff 4px 8px)"><div style="width:clamp(50px,7cqw,90px);background:#fff">${marca("#060B2A")}</div><span class="mono" style="position:absolute;left:4px;top:2px;font-size:10px;color:#2D77CC">½</span></div></div><div class="quadro" style="grid-column:span 2;flex-direction:row;gap:4cqw;align-items:flex-end"><small>Redução</small>${[["72 px",28],["40 px",18]].map(([t,s])=>`<div style="text-align:center"><div class="logo" style="font-size:${s}px;color:#060B2A">${marca("#060B2A")}orion</div><p class="mono" style="font-size:10px;color:#5E6A82;margin:6px 0 0">${t}</p></div>`).join("")}<div style="text-align:center"><div style="width:16px;margin:0 auto">${marca("#060B2A")}</div><p class="mono" style="font-size:10px;color:#5E6A82;margin:6px 0 0">16 px</p></div></div></div>`)));
P.push(folha("Marca • Assinatura conjunta",corpo(lado("Assinatura conjunta",`<p>Quando o ORION aparece ao lado de outra marca, as duas ficam na mesma altura visual, separadas por um fio vertical.</p><ul><li>Distância entre as marcas: <strong>2x</strong> (o dobro da área de proteção)</li><li>Fio de 1 px em Gelo 300, com altura do símbolo</li><li><strong>Ecossistema</strong>: ORION à esquerda, ATLAS à direita, ASTRAEUS como assinatura abaixo</li><li><strong>Cliente</strong>: a marca do cliente vem primeiro em material dele; o ORION vem primeiro em material nosso</li><li><strong>Patrocínio e eventos</strong>: ORION em grade com as demais, todas com a mesma área</li></ul>`),`<div class="palco" style="flex:1;grid-template-columns:1fr"><div class="quadro" style="flex-direction:row;gap:0"><small>Ecossistema</small>${logo("#060B2A")}<span style="width:clamp(24px,4cqw,56px)"></span><i style="width:1px;align-self:stretch;margin:8% 0;background:#C7D3E2"></i><span style="width:clamp(24px,4cqw,56px)"></span><div class="logo" style="color:#060B2A"><svg viewBox="-1 -1 2 2" style="width:1.25em;height:1.25em"><circle r=".9" fill="none" stroke="#060B2A" stroke-width=".16"/><path d="M-.9 0h1.8" stroke="#060B2A" stroke-width=".16"/></svg>ATLAS</div><span style="position:absolute;bottom:10px;font-size:9px;letter-spacing:.14em;color:#5E6A82">UNIVERSO ASTRAEUS</span></div><div class="quadro" style="flex-direction:row;gap:0"><small>Com cliente</small><div style="font-family:Georgia,serif;font-size:clamp(16px,2.2cqw,28px);font-style:italic;color:#46516A">Distribuidora Sol</div><span style="width:clamp(24px,4cqw,56px)"></span><i style="width:1px;align-self:stretch;margin:8% 0;background:#C7D3E2"></i><span style="width:clamp(24px,4cqw,56px)"></span>${logo("#060B2A")}<span class="mono" style="position:absolute;right:10px;bottom:8px;font-size:10px;color:#2D77CC">↔ 2x</span></div></div>`)));

P.push(abertura("03","Tipografia","#FDEFCB","#060B2A","s03"));
P.push(folha("Tipografia • Visão geral",corpo(lado("Três famílias",`<p>A tipografia do ORION divide o trabalho em três papéis, e cada família fica no seu.</p><p><strong>Gabarito</strong> dá voz à marca: títulos, números de destaque, assinatura. Geométrica e firme, lembra letreiro de galpão.</p><p><strong>Inter</strong> carrega o produto: tabelas, formulários, textos longos. Feita para tela, legível em 12 px.</p><p><strong>Geist Mono</strong> cuida do que precisa ser copiado sem erro: SKUs, endereços, lotes, chaves de NF-e.</p>`),`<p class="rot">Títulos</p><p style="font-size:13px;margin:0 0 8px">Gabarito · Semibold 600</p><div class="alfabeto" style="font-family:var(--display);font-weight:600">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>1234567890 !@#$%&amp;*()?+</div><p class="rot" style="margin-top:3cqw">Texto e interface</p><p style="font-size:13px;margin:0 0 8px">Inter · Regular 400 · Medium 500 · Semibold 600</p><div class="alfabeto">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>1234567890 !@#$%&amp;*()?+</div>`)));
P.push(folha("Tipografia • Primária",corpo(lado("Gabarito",`<p>É a voz da marca. Use para títulos, nomes de seção, números grandes de painel e a assinatura.</p><h3>Papel no sistema</h3><p>Usar em:</p><ul><li>Títulos de página e de seção</li><li>KPIs e números de destaque</li><li>Assinatura e materiais de venda</li></ul><p>Evitar em:</p><ul><li>Texto corrido</li><li>Tabelas e formulários</li></ul>`),`<p class="grande">Gabarito · Semibold</p><div class="specs"><div><h4>Peso: 600</h4><p>O 700 pesa demais em telas claras. Fixamos o 600 em todos os títulos.</p></div><div><h4>Espaçamento: −3% a 0</h4><ul><li>Acima de 48 px: −3%</li><li>24 a 48 px: −2%</li><li>Assinatura: +14%</li></ul></div><div><h4>Entrelinha: 92% a 115%</h4><ul><li>Uma linha: 92–100%</li><li>Duas linhas: 105%</li><li>Três ou mais: 115%</li></ul></div></div>`)));
P.push(folha("Tipografia • Texto e código",corpo(lado("Inter e Geist Mono",`<p><strong>Inter</strong> é a fonte de trabalho. Pesos 400 para texto, 500 para rótulos e botões, 600 para ênfase.</p><p>Em tabelas, ative <span class="mono">tabular-nums</span> para que os números se alinhem em coluna.</p><p><strong>Geist Mono</strong> entra sempre que um valor será lido em voz alta, digitado ou bipado. Nunca em frases.</p>`),`<p class="grande" style="font-family:var(--texto);font-weight:500;letter-spacing:-.02em">Separar 24 un. do pedido 1.042</p><div class="specs"><div><h4>Inter 400</h4><p style="font-size:14px;color:#060B2A">Recebimento conferido com 2 divergências de quantidade.</p></div><div><h4>Inter 500</h4><p style="font-size:14px;color:#060B2A;font-weight:500">Endereçar · Separar · Expedir</p></div><div><h4>Geist Mono</h4><p class="mono" style="font-size:13px;color:#060B2A">A-03-12-B<br>SKU 7891000315507<br>LOTE 2611-04</p></div></div>`)));
P.push(folha("Tipografia • Escala",corpo(lado("Escala tipográfica",`<p>Uma escala curta, com saltos claros. Se um texto não cabe em nenhum degrau, o problema é o texto.</p><p>No produto, o corpo padrão é 14 px. No site, 16 px.</p>`),`<div class="escala"><div><span class="mono">Display 64</span><b style="font-family:var(--display);font-weight:600;font-size:clamp(28px,4.4cqw,56px);letter-spacing:-.03em">Armazém em ordem</b></div><div><span class="mono">Título 32</span><b style="font-family:var(--display);font-weight:600;font-size:clamp(20px,2.6cqw,32px);letter-spacing:-.02em">Painel de operação</b></div><div><span class="mono">Seção 20</span><b style="font-family:var(--display);font-weight:600;font-size:20px">Ondas de separação</b></div><div><span class="mono">Corpo 14</span><b style="font-size:14px;font-weight:400">38 pedidos aguardando conferência na doca 2.</b></div><div><span class="mono">Rótulo 12</span><b style="font-size:12px;font-weight:500;color:#5E6A82">Última contagem há 3 dias</b></div><div><span class="mono">Código 13</span><b class="mono" style="font-size:13px">B-11-04-A · 7891000315507</b></div></div>`)));

P.push(folha("Cor • Paleta",corpo(lado("Céu de inverno",`<p>A paleta vem de uma noite fria: o azul quase preto do céu, o gelo das superfícies e um azul claro que guia o olhar.</p><p><strong>Noite</strong> e <strong>Gelo</strong> fazem 90% de qualquer tela. <strong>Céu</strong> marca ação e seleção. <strong>Creme</strong> é o calor raro: destaques, novidades.</p><h3>Acessibilidade</h3><p>Texto corrido sempre em AAA (7:1). Títulos grandes e ícones em AA (4,5:1) no mínimo.</p>`),`<div class="paleta">${cart("Primária","Noite","#060B2A","RGB 6 11 42","","#EAF1FB","larga")}${cart("Primária","Papel","#FFFFFF","RGB 255 255 255","","#060B2A","larga")}

P.push(folha("Cor • Especificação",corpo(lado("Especificação para impressão",`<p>Cada cor institucional tem equivalente para tela e para gráfica. Em impressão de alta qualidade, prefira Pantone; no dia a dia, CMYK.</p><p>Pantone Coated (C) para papel com brilho, Uncoated (U) para papel sem brilho.</p><p><strong>Valores de referência.</strong> Peça prova de cor à gráfica antes da primeira tiragem e registre aqui o que for aprovado.</p>`),`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:clamp(10px,1cqw,12px)"><tr style="text-align:left;color:#5E6A82;font-size:10px"><th style="padding:6px 4px"></th><th>Cor</th><th>HEX</th><th>RGB</th><th>CMYK</th><th>Pantone</th></tr>${[["#060B2A","Noite","6 11 42","100 90 35 65","2766 C"],["#172354","Noite 700","23 35 84","100 85 25 35","2758 C"],["#2D77CC","Céu 600","45 119 204","80 45 0 0","2172 C"],["#7DB7F0","Céu 400","125 183 240","48 15 0 0","284 C"],["#DCE8F3","Gelo 200","220 232 243","12 4 2 0","656 C"],["#5E6A82","Gelo 600","94 106 130","65 50 30 15","7545 C"],["#DDB54C","Creme 500","221 181 76","12 28 78 2","7407 C"],["#12A27A","Ok","18 162 122","80 10 65 0","3405 C"],["#E03A45","Crítico","224 58 69","5 90 70 0","1788 C"]].map(([h,n,r,c,p])=>`<tr style="border-top:1px solid #DCE3EC"><td style="padding:7px 4px"><i style="display:block;width:22px;height:22px;border-radius:4px;background:${h};border:1px solid #DCE3EC"></i></td><td style="font-weight:600">${n}</td><td class="mono">${h}</td><td class="mono">${r}</td><td class="mono">${c}</td><td class="mono">${p}</td></tr>`).join("")}</table></div>`)));
P.push(folha("Cor • Combinações",corpo(lado("Cor e texto",`<p>Cada fundo tem uma cor de texto certa. Use as combinações desta folha e nada fora delas.</p><h3>Regras</h3><ul><li>Texto Noite sobre fundos claros</li><li>Texto Papel sobre Noite, Céu 600 e estados sólidos</li><li>Céu 400 é para ação no tema escuro, nunca para texto longo</li><li>Creme nunca carrega texto pequeno em branco</li></ul><p><strong>Se a cor é a primeira coisa que alguém nota, há cor demais.</strong></p>`),`<div class="combos">${[["#FFFFFF","#060B2A","19,6:1"],["#060B2A","#EAF1FB","17,1:1"],["#2D77CC","#FFFFFF","4,6:1"],["#DCEBFC","#1E4C82","7,4:1"],["#F7F9FC","#46516A","8,1:1"],["#172354","#7DB7F0","7,2:1"],["#FFF8E7","#5F4916","8,4:1"],["#DDB54C","#3A2D0E","7,0:1"],["#E8F7F1","#0B6B4F","6,6:1"],["#FFF6DB","#7A5300","6,8:1"],["#FDECEC","#A3202A","6,4:1"],["#1A2238","#DCE8F3","13,2:1"]].map(([b,f,r])=>`<div style="background:${b};color:${f};${b=="#FFFFFF"?"border:1px solid #DCE3EC":""}"><b>Aa</b><span>Pedido separado</span><em>${r}</em></div>`).join("")}</div>`)));

P.push(folha("Ícones • Sistema",corpo(lado("Iconografia",`<p>Os ícones seguem a família <strong>Lucide</strong>: traço de 1,5 px numa grade de 24 px, cantos arredondados, sem preenchimento.</p><ul><li>Tamanhos: 16, 20 e 24 px</li><li>Cor herda do texto ao lado</li><li>Sempre acompanhados de rótulo, exceto em ações universais (fechar, buscar)</li><li>Nunca misturar ícones preenchidos e de traço</li></ul><p>No site, ícones surgem com um pequeno salto, em cascata de 60 ms.</p>`),`<div class="ico">${[["caixa","Produto"],["caminhao","Expedição"],["bipe","Bipar"],["local","Endereço"],["lista","Conferência"],["predio","Armazém"],["grafico","Painel"],["alerta","Divergência"],["onda","Onda"],["nota","NF-e"],["porta","Doca"],["usuario","Operador"]].map(([k,t])=>`<div>${ic(k)}<span>${t}</span></div>`).join("")}</div>`)));

P.push(folha("Imagem • Fotografia",corpo(lado("Fotografia",`<p>Fotos mostram armazéns reais e pessoas trabalhando. Nada de banco de imagem com aperto de mão ou globo digital.</p><h3>Tratamento</h3><ul><li>Luz natural ou fria de galpão</li><li>Temperatura levemente azulada, sombras em direção ao Noite</li><li>Enquadramentos de corredor: linhas verticais como no símbolo</li><li>Pessoas de verdade, com EPI, em ação</li></ul><h3>Evitar</h3><ul><li>Filtros quentes ou saturados</li><li>Estrelas, galáxias e céus digitais</li><li>Telas de computador flutuando</li></ul>`),`<div class="mesa" style="grid-template-columns:2fr 1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)"><div class="foto" style="${fotoBg("#33448F","#060B2A")};grid-row:span 2;color:#EAF1FB"><b style="color:#7DB7F0">Sim · corredor</b>Corredor de porta-paletes, luz fria, operador ao fundo</div><div class="foto" style="${fotoBg("#9DC7F4","#2D77CC")};color:#060B2A"><b>Sim · detalhe</b>Etiqueta sendo bipada</div><div class="foto" style="${fotoBg("#DCE8F3","#7E8BA2")};color:#060B2A"><b>Sim · doca</b>Caminhão encostado na doca</div><div class="foto" style="${fotoBg("#F8E2A6","#E03A45")};color:#fff"><b style="color:#fff">Não</b>Filtro quente, saturado</div><div class="foto" style="background:radial-gradient(circle at 30% 30%,#7c3aed,#060B2A);color:#fff"><b style="color:#fff">Não</b>Galáxia digital</div></div>`)));
P.push(folha("Imagem • Grid",corpo(lado("Grid e respiro",`<p>Telas e peças usam grade de <strong>12 colunas</strong> com calha de 24 px no desktop, 8 colunas no tablet e 4 no celular.</p><p>Espaços seguem múltiplos de 4: 4, 8, 12, 16, 24, 32, 48, 64.</p><p>Nas peças, o texto ocupa no máximo 7 colunas. O resto respira.</p>`),`<div style="position:relative;flex:1;display:flex"><div class="grid12">${"<span></span>".repeat(12)}</div><div style="position:absolute;left:0;top:14%;width:57%;background:#060B2A;color:#EAF1FB;padding:2cqw"><div style="font-family:var(--display);font-weight:600;font-size:clamp(16px,2.6cqw,32px);line-height:1">Texto em 7 colunas</div><div style="font-size:11px;color:#7DB7F0;margin-top:8px">calha 24 px · margem 64 px</div></div></div>`)));

P.push(folha("Gráficos • Indicadores",corpo(lado("Cartão de indicador",`<p>Os indicadores do dashboard seguem um único desenho, o <span class="mono">KpiCard</span>. São doze, todos calculados das movimentações reais: Produtos ativos, Endereços ativos, Ocupação do armazém, Recebimentos pendentes, Em conferência, Aguardando armazenagem, Tarefas pendentes, Produtos bloqueados, Pedidos a separar, Pedidos expedidos e Divergências em aberto.</p>`),`<div style="display:flex;flex-direction:column;gap:2cqw;flex:1;justify-content:center">${shot("kpis")}<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4cqw">${nota("1","Rótulo em Inter 12 medium, cor secundária. Nunca em caixa alta.")}${nota("2","Valor em Inter 28 medium, tabular-nums. Quantidade leva “un” menor ao lado.")}${nota("3","Dica de contexto abaixo: “de 169 cadastrados”, “11 nos últimos 30 dias”.")}${nota("4","Mini barras dos últimos dias. A barra azul é hoje; as demais, Noite.")}${nota("5","Selo Atenção ou Crítico só aparece quando o número pede ação.")}${nota("6","Ícone de informação traz a definição do cálculo. Nenhum número sem origem.")}</div></div>`)));
P.push(folha("Gráficos • O símbolo mede",corpo(lado("O símbolo como medidor",`<p>O gráfico mais característico do ORION é o próprio símbolo. Os <strong>14 trechos</strong> das sete colunas acendem em Céu 400 conforme a ocupação, coluna a coluna, de baixo para cima. O resto fica em Gelo 200.</p><p>Ao lado, cada zona ganha uma <strong>faixa de 12 blocos</strong> de larguras variadas, como prateleiras. Acima de 70%, os blocos cheios passam para Atenção.</p><p>Componentes: <span class="mono">GlyphGauge</span> e <span class="mono">BlockBar</span>.</p>`),`<div class="palco" style="flex:1;grid-template-columns:1.1fr 1fr"><div class="quadro" style="align-items:stretch;justify-content:center"><small>Na tela</small>${shot("ocupacao","margin:auto;width:92%")}</div><div class="quadro" style="gap:1.4cqw"><small>Escala de acendimento</small><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4cqw;width:100%">${[[0,"0%"],[4,"25%"],[7,"50%"],[11,"75%"],[14,"100%"],[6,"45,9%"],[9,"64%"],[13,"92%"]].map(([n,t])=>`<div style="text-align:center"><div style="width:72%;margin:0 auto">${glyph(n)}</div><p class="mono" style="font-size:10px;color:#5E6A82;margin:4px 0 0">${t}</p></div>`).join("")}</div></div></div>`)));
P.push(folha("Gráficos • Fluxo e tarefas",corpo(lado("Fluxo e tarefas",`<p><strong>Recebimentos × expedições</strong>: colunas empilhadas por dia, Noite para o que entrou e Céu 600 para o que saiu. A altura da coluna é o movimento total. Legenda embaixo, com totais do período.</p><p><strong>Tarefas por tipo</strong>: concluídas na base, em execução no meio, pendentes no topo, para cada tipo de tarefa.</p><p><strong>Alertas operacionais</strong>: ícone com cor de estado, título curto e detalhe em uma linha.</p>`),`<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:1.6cqw;flex:1;min-height:0;align-items:start"><div style="display:flex;flex-direction:column;gap:1.6cqw;min-width:0">${shot("fluxo")}${shot("tarefas")}</div><div style="min-width:0">${shot("alertas")}</div></div>`)));
P.push(folha("Gráficos • Pílulas",corpo(lado("Pílulas de estado",`<p>Pílulas dizem em que estado algo está. Elas apoiam a leitura, nunca a substituem.</p><h3>Regras</h3><ul><li>Uma ou duas palavras, sempre com o ponto de cor</li><li>Fundo claro + texto escuro do mesmo estado</li><li>Nunca usar como botão</li><li>Em tabelas, uma pílula por linha</li><li>Cor nunca é o único sinal: o texto diz o estado</li></ul><p><strong>Se a pílula é a primeira coisa notada, há pílulas demais.</strong></p>`),`<div class="pilulas" style="flex:1">${[["ok","Conferido"],["info","Em separação"],["warn","Divergência"],["neu","Aguardando"],["crit","Ruptura"],["ok","Expedido"],["info","Recebendo"],["warn","Validade próxima"],["neu","Rascunho"],["crit","Bloqueado"],["ok","Inventário fechado"],["info","Em trânsito"],["warn","Sem endereço"],["neu","Arquivado"],["info","Onda 14"],["crit","NF-e rejeitada"]].map(([c,t])=>`<span class="pil ${c}"><i></i>${t}</span>`).join("")}</div>`)));

P.push(abertura("07","Interface","#2D77CC","#FFFFFF","s07"));
P.push(folha("Interface • O sistema",corpo(lado("O sistema como ele é",`<p>Esta é a tela de abertura do ORION, o <strong>Dashboard operacional</strong>, capturada da versão em produção com a empresa de demonstração.</p><p>Tudo o que este livro define está aqui: barra lateral em grupos (Visão geral, Armazém, Entrada, Operações), cabeçalho com empresa e CNPJ, ações rápidas em pílula, doze indicadores e os gráficos que nascem do símbolo.</p><p><strong>Na dúvida sobre como algo deve parecer, a referência é a tela, não o livro.</strong></p>`),`<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#EDF2F8,#C7D3E2);border-radius:4px;padding:3%"><div style="width:100%;background:#1A2238;border-radius:12px;padding:1.2% 1.2% 1.6%;box-shadow:0 30px 60px rgba(6,11,42,.3)"><div style="display:flex;gap:5px;margin:0 0 1% 1%">${["#E03A45","#E0A100","#12A27A"].map(c=>`<i style="width:7px;height:7px;border-radius:50%;background:${c};opacity:.8"></i>`).join("")}</div><img src="${IMG.painel}" alt="Dashboard operacional do ORION" style="display:block;width:100%;border-radius:6px"></div></div>`)));
P.push(folha("Interface • Formas",corpo(lado("Formas e controles",`<p>Três raios para tudo: <strong>6</strong> para elementos pequenos, <strong>10</strong> para cartões e campos, <strong>18</strong> para painéis e diálogos. Botões são sempre em pílula.</p><p>Contorno de 1 px separa objetos. Sombra só em camadas que flutuam: menus, diálogos, avisos.</p>`),`<div class="palco" style="flex:1"><div class="quadro"><small>Raios</small><div class="raios">${[6,10,18].map(r=>`<div><div style="border-radius:${r}px"></div><p>${r} px</p></div>`).join("")}<div><div style="border-radius:999px;width:9cqw"></div><p>pílula</p></div></div></div><div class="quadro"><small>Botões</small><div class="ui"><button class="btn" style="background:#060B2A;color:#fff">Liberar onda</button><button class="btn" style="background:#fff;color:#46516A;border-color:#C7D3E2">Cancelar</button><button class="btn" style="background:#E03A45;color:#fff">Bloquear endereço</button></div></div><div class="quadro" style="grid-column:span 2;align-items:stretch"><small>Campo</small><label style="font-size:12px;font-weight:500;margin-top:14px" for="end">Endereço de destino</label><input id="end" class="mono" value="A-03-12-B" style="border:1px solid #C7D3E2;border-radius:10px;padding:9px 12px;font-size:14px;color:#060B2A;background:#fff;max-width:320px"></div></div>`)));
P.push(folha("Interface • Movimento",corpo(lado("Movimento",`<p>O movimento explica de onde algo veio e para onde foi. Ele nunca atrasa quem trabalha.</p><ul><li><strong>Entrar</strong>: 180–240 ms, subida de 8 px</li><li><strong>Sair</strong>: 120 ms, só opacidade</li><li><strong>Números</strong>: contam até o valor em 1,4 s</li><li><strong>Ícones</strong>: surgem em cascata, 60 ms entre um e outro</li><li><strong>Símbolo</strong>: barras surgem de baixo para cima, 40 ms cada</li></ul><p>Com “reduzir movimento” ativo no aparelho, tudo aparece pronto, sem animação.</p>`),`<div class="specs" style="flex:1;align-content:center"><div class="quadro" style="min-height:140px"><small>Curva</small><svg viewBox="0 0 100 100" style="width:60%"><path d="M5 95 C 40 95, 30 5, 95 5" fill="none" stroke="#2D77CC" stroke-width="2.5"/><path d="M5 95 L95 5" stroke="#C7D3E2" stroke-dasharray="3 3"/></svg><span class="mono" style="font-size:10px;color:#5E6A82">cubic-bezier(.2,.7,.2,1)</span></div><div class="quadro" style="min-height:140px"><small>Contagem</small><b id="conta" style="font-family:var(--display);font-weight:600;font-size:40px">0</b><span style="font-size:10px;color:#5E6A82">pedidos no dia</span></div><div class="quadro" style="min-height:140px"><small>Cascata</small><div style="display:flex;gap:8px" id="cascata">${[0,1,2,3].map(()=>`<span style="width:22px;height:22px;border-radius:6px;background:#060B2A;display:block"></span>`).join("")}</div></div></div>`)));

P.push(abertura("08","Voz","#FFF8E7","#060B2A","s08"));
P.push(folha("Voz • Como falamos",corpo(lado("Tom de voz",`<p>O ORION fala como um bom líder de turno: direto, calmo, sem jargão de sistema.</p><ul><li>Verbo no início dos botões</li><li>Números com unidade</li><li>Erros dizem o que houve e como resolver</li><li>Sem desculpas, sem exclamações</li><li>Chamar as coisas pelo nome do chão do armazém</li></ul>`),`<div class="voz" style="flex:1"><div class="sim"><b style="color:#0B6B4F">Assim</b>Separar 24 un. em A-03-12-B</div><div class="nao2"><b style="color:#A3202A">Não assim</b>Executar tarefa de picking #8841</div><div class="sim"><b style="color:#0B6B4F">Assim</b>NF-e rejeitada: CNPJ do destinatário inválido. Corrija no pedido 1.042 e envie de novo.</div><div class="nao2"><b style="color:#A3202A">Não assim</b>Ops! Algo deu errado. Tente novamente mais tarde.</div><div class="sim"><b style="color:#0B6B4F">Assim</b>Inventário fechado. 3 divergências ajustadas.</div><div class="nao2"><b style="color:#A3202A">Não assim</b>Parabéns!!! Processo concluído com sucesso!</div></div>`)));

P.push(folha("Aplicações • Elementos",corpo(lado("Kit de elementos",`<p>Quatro elementos saem do símbolo e da constelação. Juntos, eles fazem uma peça ser ORION mesmo sem o nome escrito.</p><ul><li><strong>Cinturão</strong>: as barras do símbolo repetidas em volta de um círculo, girando devagar. É a assinatura sem palavras</li><li><strong>Símbolo recortado</strong>: o O gigante, sangrando para fora da peça</li><li><strong>Coluna acesa</strong>: uma das sete colunas em Céu, as outras em tom sobre tom. Marca o item em foco</li><li><strong>Padrão de barras</strong>: as colunas do símbolo repetidas como prateleiras</li></ul><p>Use no máximo dois por peça. Órbitas de linha fina e pontos soltos não fazem parte da marca: o círculo do ORION é sempre feito de barras.</p>`),`<div class="mesa" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[["Símbolo recortado",`<div class="mk" style="background:#060B2A;aspect-ratio:3/4">${sup("#172354","right:-45%;bottom:-25%;width:150%")}</div>`],["Coluna acesa",`<div class="mk" style="background:#060B2A;aspect-ratio:3/4;justify-content:center"><svg viewBox="-1 -1 2 2">${SGcol(3,"#7DB7F0","#172354")}</svg></div>`],["Cinturão",`<div class="mk" style="background:#060B2A;aspect-ratio:3/4;align-items:center;justify-content:center"><div style="position:absolute;left:-20%;top:5%;width:140%">${cinturao("externo",84)}</div><div style="width:24%;position:relative">${marca("#EAF1FB")}</div></div>`],["Padrão de barras",`<div class="mk" style="background:#F1F7FE;aspect-ratio:3/4">${padrao("#060B2A",.9)}</div>`]].map(([t,h])=>`<div>${h}<p class="leg">${t}</p></div>`).join("")}</div>`)));
P.push(folha("Aplicações • Redes sociais",corpo(lado("Feed",`<p>No feed, cada post diz uma coisa só, e os elementos da marca fazem o resto. Três famílias cobrem quase tudo:</p><ul><li><strong>Novidade</strong>: Noite, símbolo recortado ao fundo, etiqueta Creme</li><li><strong>Número</strong>: um indicador real do dashboard dentro do cinturão, com o símbolo-medidor acima</li><li><strong>Dica</strong>: Gelo com padrão de barras, cada passo numa coluna</li></ul><h3>Formatos</h3><p class="mono" style="font-size:11px">Feed 1080×1350 · Quadrado 1080×1080<br>Story 1080×1920 · LinkedIn 1200×627</p>`),`<div class="mesa" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><div class="mk" style="background:#060B2A;color:#EAF1FB;aspect-ratio:4/5">${sup("#172354","right:-55%;top:-12%;width:150%")}<span class="tag" style="background:#FDEFCB;color:#5F4916;position:relative">Novidade</span><div style="position:relative"><h5 style="font-size:clamp(18px,2.6cqw,32px)">Aba Comex no armazém</h5><p style="margin:8px 0 0;font-size:clamp(9px,.95cqw,12px);color:#7DB7F0">Contêiner e DI ao lado do recebimento.</p></div><div style="display:flex;justify-content:space-between;align-items:center;position:relative">${sig("#7DB7F0")}<div style="width:22%">${cinto("#EAF1FB")}</div></div></div><p class="leg">Novidade · símbolo recortado</p></div><div><div class="mk" style="background:#060B2A;color:#EAF1FB;aspect-ratio:4/5;align-items:center;justify-content:center;text-align:center"><div style="position:absolute;left:-12%;top:6%;width:124%;opacity:.9">${cinturao("interno",84)}</div><div style="position:relative"><div style="width:16%;margin:0 auto 6px">${glyph(6,"#7DB7F0","#22306F")}</div><h5 style="font-size:clamp(34px,5.4cqw,68px)">45,9%</h5><p style="margin:6px 0 0;font-size:clamp(9px,1cqw,12px);color:#9DC7F4">Ocupação do armazém · 6/14 trechos acesos</p></div><div style="position:absolute;bottom:1.6cqw;left:1.6cqw">${sig("#7DB7F0")}</div></div><p class="leg">Número · cinturão e símbolo-medidor</p></div><div><div class="mk" style="background:#F1F7FE;color:#060B2A;aspect-ratio:4/5;padding:0"><div style="position:relative;height:42%">${padrao("#060B2A")}</div><div style="padding:1.6cqw;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:space-between"><span class="tag" style="background:#DCEBFC;color:#1E4C82">Dica</span><h5 style="font-size:clamp(13px,1.7cqw,21px)">Inventário rotativo em 3 passos</h5><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:clamp(8px,.8cqw,10px);color:#46516A">${["Curva A","Contagem cega","Ajuste"].map((t,i)=>`<span><b class="mono" style="color:#2D77CC">0${i+1}</b><br>${t}</span>`).join("")}</div>${sig("#060B2A")}</div></div><p class="leg">Dica · padrão de barras</p></div></div>`)));
P.push(folha("Aplicações • Stories e capas",corpo(lado("Stories, carrossel e capas",`<p>No story, o cinturão ocupa a tela, cortado pelas bordas. Zona segura de 250 px em cima e embaixo.</p><p>No carrossel, o símbolo gigante atravessa os cards: cada card mostra um pedaço, e o O só se completa quando a pessoa arrasta até o fim.</p><p>No perfil, só o símbolo. Na capa do LinkedIn, o cinturão entra cortado pela direita.</p>`),`<div class="mesa" style="grid-template-columns:1fr 2.4fr"><div><div class="mk" style="background:#060B2A;color:#EAF1FB;aspect-ratio:9/16"><div style="position:absolute;left:-55%;top:8%;width:210%">${cinturao("externo",96)}</div><span class="tag" style="background:#DDB54C;color:#060B2A;position:relative">Ao vivo</span><h5 style="font-size:clamp(15px,2cqw,26px);position:relative">Webinar: fim da planilha de estoque</h5><span style="position:relative">${sig("#7DB7F0")}</span></div><p class="leg">Story · 1080×1920</p></div><div style="display:flex;flex-direction:column;gap:1.4cqw;min-width:0"><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative;overflow:hidden">${[["01/03","Seu estoque está certo?"],["02/03","A contagem cega acha o que a planilha esconde."],["03/03","Teste o ORION por 30 dias."]].map(([n,t],i)=>`<div class="mk" style="background:#060B2A;color:#EAF1FB;aspect-ratio:1;border-radius:0;border-right:${i<2?"1px dashed #33448F":"0"}"><div style="position:absolute;top:-10%;left:${-i*100+20}%;width:260%;opacity:.9">${marca("#172354")}</div><span class="mono" style="font-size:9px;color:#7DB7F0;position:relative">${n}</span><h5 style="font-size:clamp(11px,1.4cqw,17px);position:relative">${t}</h5><span style="position:relative">${i==2?sig("#7DB7F0"):`<span style="font-size:9px;color:#7DB7F0">arraste →</span>`}</span></div>`).join("")}</div><p class="leg" style="margin:0">Carrossel · o símbolo atravessa os três cards</p><div style="display:grid;grid-template-columns:auto 1fr;gap:1.4cqw;align-items:center"><d adding:8px"><svg viewBox="0 0 300 120" style="height:100%;max-height:100%;max-width:100%" style="width:100%"><path d="M20 20h170v75H20z" fill="#fff" stroke="#A6B3C6"/><path d="M190 40h50l35 30v25h-85z" fill="#fff" stroke="#A6B3C6"/><path d="M200 46h38l24 22h-62z" fill="#DCEBFC"/><rect x="20" y="80" width="255" height="15" fill="#060B2A"/><g transform="translate(40 30)"><g transform="translate(10 10) scale(10)">${marca("#060B2A").replace(/<\/?svg[^>]*>/g,"")}</g><text x="26" y="15" font-family="Gabarito,sans-serif" font-weight="600" font-size="15" fill="#060B2A">orion</text></g><g transform="translate(160 62) scale(9)">${SG("#2D77CC")}</g><circle cx="70" cy="98" r="13" fill="#1A2238"/><circle cx="225" cy="98" r="13" fill="#1A2238"/></svg></div><p class="leg">Frota · furgão</p></div></div>`)));
P.push(folha("Aplicações • Coletor",corpo(lado("No coletor",`<p>O operador usa o ORION num celular ou coletor Android, muitas vezes de luva e com pouca luz. Por isso, o coletor é a versão mais simples da marca:</p><ul><li>Barra superior Noite com o símbolo e a palavra <strong>Coletor</strong></li><li>Três ações grandes em cartões com contorno: <strong>Minhas tarefas</strong>, <strong>Contagem de inventário</strong>, <strong>Consulta rápida</strong></li><li>Ícone à esquerda, título em Gabarito, contagem logo abaixo</li><li>Alvos de toque de 56 px no mínimo</li><li>Nada de gráfico, nada de cor decorativa</li></ul><p>Telas capturadas da versão em produção.</p>`),`<div style="flex:1;min-height:0;display:flex;gap:4cqw;align-items:center;justify-content:center;background:linear-gradient(160deg,#EDF2F8,#C7D3E2);border-radius:4px">${["col1","col2"].map(k=>`<div style="height:88%;aspect-ratio:600/1021;background:#060B2A;border-radius:28px;padding:10px;box-shadow:0 30px 60px rgba(6,11,42,.3)"><img src="${IMG2[k]}" alt="" style="display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:20px"></div>`).join("")}</div>`)));

P.push(folha("Arquivos da marca",corpo(lado("Arquivos da marca",`<p>Use sempre estes arquivos. Nunca redesenhe o logo nem digite “orion” ao lado do símbolo.</p><p>Eles estão no repositório do sistema, na pasta:</p><p class="mono" style="font-size:12px;color:#060B2A">docs/marca/arquivos/</p><ul><li><strong>SVG</strong>: vetor, para web, impressão e gráfica. O nome já está convertido em curvas</li><li><strong>PNG</strong>: fundo transparente, para documentos e apresentações</li></ul><p>No código, use os componentes <span class="mono">OrionLogo</span> e <span class="mono">OrionMark</span>.</p>`),`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:clamp(10px,1cqw,12px)"><tr style="text-align:left;color:#5E6A82;font-size:10px"><th style="padding:6px 4px"></th><th>Arquivo</th><th>Formatos</th><th>Uso</th></tr>${[["h","noite","orion-logo-horizontal-noite","SVG · PNG","Principal, sobre fundos claros"],["h","branco","orion-logo-horizontal-branco","SVG · PNG","Negativa, sobre Noite e fotos"],["h","preto","orion-logo-horizontal-preto","SVG · PNG","Monocromática"],["v","noite","orion-logo-vertical-noite / branco / preto","SVG · PNG","Peças quadradas e estreitas"],["s","noite","orion-simbolo-noite / branco / preto / ceu","SVG · PNG 1024","Elemento-síntese, perfil, carimbo"],["i","","orion-icone-app","SVG · PNG 32/180/512/1024","Ícone do app, favicon, atalho"]].map(([t,c,n,f,u])=>{const cor={noite:"#060B2A",branco:"#FFFFFF",preto:"#000"}[c];const bg=c==="branco"?"#060B2A":"#F7F9FC";const prev=t==="i"?`<div style="width:30px;height:30px;border-radius:7px;background:#7DB7F0;display:flex;align-items:center;justify-content:center"><div style="width:72%">${marca("#060B2A")}</div></div>`:t==="s"?`<div style="width:28px">${marca(cor)}</div>`:t==="v"?`<div class="logo" style="flex-direction:column;gap:2px;font-size:9px;color:${cor}">${marca(cor,'style="width:2.2em;height:2.2em"')}orion</div>`:`<div class="logo" style="font-size:13px;color:${cor}">${marca(cor)}orion</div>`;return `<tr style="border-top:1px solid #DCE3EC"><td style="padding:8px 6px;width:96px"><div style="background:${bg};border-radius:6px;padding:8px;display:flex;justify-content:center">${prev}</div></td><td class="mono" style="font-size:11px">${n}</td><td class="mono" style="font-size:10px;color:#5E6A82">${f}</td><td>${u}</td></tr>`}).join("")}</table></div>`)));

P.push(folha("Ecossistema • ASTRAEUS",corpo(lado("Universo ASTRAEUS",`<p>ORION é um dos sistemas do universo ASTRAEUS. Cada sistema tem nome de astro e marca própria, e todos compartilham a mesma conta e os mesmos dados.</p><p>Nos materiais do ORION, o ecossistema aparece só como assinatura discreta no rodapé: <strong>“ORION é do universo ASTRAEUS”</strong>.</p>`),`<div class="eco" style="flex:1;align-content:center"><div style="border-color:#060B2A"><h4>ORION</h4><p>Armazém: recebimento, endereçamento, separação, inventário e expedição.</p></div><div><h4>ATLAS</h4><p>ERP: pedidos, notas fiscais, financeiro e cadastros que alimentam o ORION.</p></div><div style="background:#F7F9FC"><h4 style="color:#5E6A82">ASTRAEUS</h4><p>A casa dos sistemas. Login único e dados compartilhados.</p></div></div>`)));

/* demonstração de movimento na folha 05 */
const calmo=matchMedia("(prefers-reduced-motion: reduce)").matches;
const conta=document.getElementById("conta"),casc=[...document.querySelectorAll("#cascata span")];
const rodar=()=>{ if(calmo){conta.textContent="1.042";return}
  const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-p,3);conta.textContent=Math.round(1042*e).toLocaleString("pt-BR");if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f);
  casc.forEach((s,i)=>s.animate([{opacity:.15,transform:"translateY(8px) scale(.8)"},{opacity:1,transform:"none"}],{duration:240,delay:i*60,easing:"cubic-bezier(.2,.7,.2,1)",fill:"backwards"}));};
conta.textContent="1.042";
if("IntersectionObserver" in window){new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&rodar()),{threshold:.6}).observe(conta)}
